<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RYDZ TATTOO & ART</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #030406;
      --accent-neon: #e6c594;
      --glass-border: rgba(230, 197, 148, 0.25);
      --font-title: 'Syne', sans-serif;
      --font-body: 'Space Grotesk', sans-serif;
    }

    body.mode-art {
      --accent-neon: #00f0ff;
      --glass-border: rgba(0, 240, 255, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-dark); color: #f0f3f8; font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }

    /* AURORA BG */
    .portal-bg { position: fixed; inset: -50%; width: 200%; height: 200%; z-index: -3; pointer-events: none; opacity: 0.5; filter: blur(90px); animation: auroraMove 18s ease infinite alternate; }
    @keyframes auroraMove { 0% { transform: translate(-10%, -10%) rotate(0deg); } 100% { transform: translate(10%, 10%) rotate(180deg); } }

    /* HEADER - Responsywny */
    header { position: fixed; top: 0; width: 100%; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; backdrop-filter: blur(20px); background: rgba(3, 4, 6, 0.85); border-bottom: 1px solid var(--glass-border); }

    /* CONTENT - Elastyczny */
    main { padding-top: 8rem; max-width: 1400px; margin: 0 auto; padding-left: 5%; padding-right: 5%; }

    /* GRIDS - Automatyczna responsywność */
    .grid-3 { display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    
    .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; margin-bottom: 5rem; }
    
    .about-section { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; padding: 3rem; background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); }

    /* FONT SCALING */
    .hero-title { font-size: clamp(2.5rem, 5vw, 5rem); line-height: 1; text-transform: uppercase; }

    /* FAQ RESPONSIVE */
    .faq-item { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); margin-bottom: 1rem; }
    .faq-question { padding: 1.5rem; cursor: pointer; display: flex; justify-content: space-between; font-family: var(--font-title); }

    /* RESPONSIVE MEDIA QUERIES */
    
    /* Tablety i mniejsze ekrany */
    @media (max-width: 1024px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .about-section { grid-template-columns: 1fr; }
    }

    /* Telefony */
    @media (max-width: 600px) {
      header { padding: 1rem; flex-direction: column; gap: 1rem; }
      .grid-3 { grid-template-columns: 1fr; }
      .hero-title { font-size: 2rem; }
      .about-section { padding: 1.5rem; }
    }

    /* Bardzo szerokie ekrany */
    @media (min-width: 1600px) {
      main { max-width: 1600px; }
    }

    .page-view { display: none; }
    .page-view.active { display: block; }
    
    .action-link { padding: 0.8rem 1.5rem; background: var(--accent-neon); color: #000; text-decoration: none; font-weight: 700; display: inline-block; }
  </style>
</head>
<body class="mode-tattoo">

  <div class="portal-bg"></div>

  <header>
    <div class="brand" onclick="switchTab('tattoo')">
      <div class="brand-top">* RYDZ *</div>
    </div>
    
    <div class="switcher-box">
      <button class="tab-btn active" id="tab-tattoo" onclick="switchTab('tattoo')">Tatuaże</button>
      <button class="tab-btn" id="tab-art" onclick="switchTab('art')">Malarstwo</button>
    </div>

    <a href="#" class="action-link" id="header-action-btn">Instagram ↗</a>
  </header>

  <main>
    <div id="view-tattoo" class="page-view active">
      <section class="hero">
        <div>
          <h1 class="hero-title">Rytuał & <span>Tatuaż</span></h1>
          <p>Kameralne studio w Katowicach.</p>
        </div>
        <div class="wild-card">Dostępne terminy w 2026!</div>
      </section>

      <section class="about-section">
        <img src="fddd8b45-fa11-4fa2-88ed-393dd84bed07.jpg" style="width: 100%;" alt="o mnie">
        <div>
          <h2>O mnie</h2>
          <p>Tworzę tatuaże, które opowiadają historie.</p>
        </div>
      </section>

      <section class="info-section">
        <h3>FAQ</h3>
        <div class="faq-item">
          <div class="faq-question">Jak się umówić? <span>+</span></div>
          <div class="faq-answer" style="padding: 1.5rem; display: none;">Napisz DM na IG z opisem projektu.</div>
        </div>
        <div class="faq-item">
          <div class="faq-question">Jak dbać o tatuaż? <span>+</span></div>
          <div class="faq-answer" style="padding: 1.5rem; display: none;">Myj, nawilżaj, nie drap.</div>
        </div>
      </section>
    </div>

    <div id="view-art" class="page-view">
      <h1 class="hero-title">Galeria Sztuki</h1>
    </div>
  </main>

  <script>
    // FAQ logic
    document.querySelectorAll('.faq-question').forEach(q => {
      q.addEventListener('click', () => {
        const answer = q.nextElementSibling;
        answer.style.display = answer.style.display === 'block' ? 'none' : 'block';
      });
    });

    // Tab switch logic
    function switchTab(tab) {
      document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + tab).classList.add('active');
    }
  </script>
</body>
</html>
